<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>XOXO Tic Tac Toe XOXO</title>
     <link rel="icon" type="image/png" sizes="32x32" href="icon.jpg" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="mag-continer hide"> 
        <p id="mag"> winner</p>
        <button id="new-game"><i class="fa-solid fa-crown"></i>new Game</button>
    </div>

    <main>
        <h1 id="title">XOXO-Tic Tac Toe-XOXO</h1>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button class="bar"><i class="fa-solid fa-bars"></i></i></button>
        <button id="resSert"> <i class="fa-solid fa-arrows-rotate" id="rotate"></i> Reset Game</button>
        <button class="shir"><i class="fa-solid fa-share-nodes"></i></button>
    </main>
   <div class="wt-play">
    <h3>How to Play Tic Tac Toe?</h3>
    <ul>
        <li>Played by 2 players.</li>
        <li>Players take turns marking one empty box.</li>
        <li>Get 3 marks in a row to win.</li>
        <li>Win horizontally, vertically, or diagonally.</li>
    </ul>
   </div>


    

    <script src="app.js"></script>
</body>

</html>
